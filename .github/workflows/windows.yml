# Notchyyyy for Windows: build, run the tests, then check the overlay on a real Windows desktop.
name: Windows

on:
  push:
    branches: [windows-port]
    paths: ['windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: windows
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: .NET SDK in use (pinned by windows/global.json)
        run: dotnet --version

      - name: Build
        id: build
        run: dotnet build Notchyyyy.sln -c Release

      - name: Tests (springs, hover rules, pixel-level frames)
        id: tests
        env:
          NOTCHYYYY_FRAMES: ${{ runner.temp }}/frames
        # each test is named as it finishes; one stuck for 4 minutes is stopped and named (blame-hang), so a hang can't
        # silently eat the whole job
        timeout-minutes: 30
        run: dotnet test Notchyyyy.sln -c Release --no-build --logger "trx;LogFileName=tests.trx" --logger "console;verbosity=normal" --blame-hang --blame-hang-timeout 4m --results-directory "$env:RUNNER_TEMP/test-results"

      # The build users get: precompiled (ReadyToRun) for Windows x64. Self-tests and measurements use it.
      - name: Publish (ReadyToRun, as shipped)
        id: publish
        run: dotnet publish src/Notchyyyy/Notchyyyy.csproj -c Release -r win-x64 --self-contained false -p:PublishReadyToRun=true -o "$env:RUNNER_TEMP/app"

      - name: Overlay self-test (dark)
        if: always() && steps.publish.outcome == 'success'
        run: |
          $p = Start-Process -FilePath "$env:RUNNER_TEMP/app/Notchyyyy.exe" -ArgumentList '--win-selftest','--dark','--out',"$env:RUNNER_TEMP/selftest" -PassThru -Wait
          Get-Content "$env:RUNNER_TEMP/selftest/selftest-dark.txt"
          exit $p.ExitCode

      - name: Overlay self-test (light)
        if: always() && steps.publish.outcome == 'success'
        run: |
          $p = Start-Process -FilePath "$env:RUNNER_TEMP/app/Notchyyyy.exe" -ArgumentList '--win-selftest','--light','--out',"$env:RUNNER_TEMP/selftest" -PassThru -Wait
          Get-Content "$env:RUNNER_TEMP/selftest/selftest-light.txt"
          exit $p.ExitCode

      # Smoothness: a scripted session with every frame timed (see src/Notchyyyy/PerfProbe.cs), comparing Sprout
      # redraw rates (0 = every display frame). This runner has no graphics card, so it's a worst case.
      - name: Smoothness at 100 %
        if: always() && steps.publish.outcome == 'success'
        run: |
          $runs = @(
            @{ name = 'defaults';             args = @() },
            @{ name = 'every-frame';          args = @('--sprout-fps','0','--mini-fps','0') },
            @{ name = 'defaults-nolayered';   args = @('--no-layered') }
          )
          foreach ($r in $runs) {
            $dir = "$env:RUNNER_TEMP/perf/100-$($r.name)"
            $p = Start-Process -FilePath "$env:RUNNER_TEMP/app/Notchyyyy.exe" -ArgumentList (@('--dark','--name','Alex','--perf',$dir) + $r.args) -PassThru -Wait
            Write-Host "=== 100 %: $($r.name)"
            Get-Content "$dir/summary.txt"
          }

      # Laptops usually run at 125-150 % scaling. Switch the runner's screen live, then repeat the self-test.
      - name: Overlay self-test at 125 % (1920x1080)
        if: always() && steps.publish.outcome == 'success'
        run: |
          ./ci/display.ps1 -Width 1920 -Height 1080 -Scale 125
          $p = Start-Process -FilePath "$env:RUNNER_TEMP/app/Notchyyyy.exe" -ArgumentList '--win-selftest','--dark','--out',"$env:RUNNER_TEMP/selftest/scale-125" -PassThru -Wait
          Get-Content "$env:RUNNER_TEMP/selftest/scale-125/selftest-dark.txt"
          exit $p.ExitCode

      - name: Overlay self-test at 150 % (1920x1080)
        if: always() && steps.publish.outcome == 'success'
        run: |
          ./ci/display.ps1 -Width 1920 -Height 1080 -Scale 150
          $p = Start-Process -FilePath "$env:RUNNER_TEMP/app/Notchyyyy.exe" -ArgumentList '--win-selftest','--light','--out',"$env:RUNNER_TEMP/selftest/scale-150" -PassThru -Wait
          Get-Content "$env:RUNNER_TEMP/selftest/scale-150/selftest-light.txt"
          exit $p.ExitCode

      - name: Smoothness at 150 %
        if: always() && steps.publish.outcome == 'success'
        run: |
          $dir = "$env:RUNNER_TEMP/perf/150-defaults"
          $p = Start-Process -FilePath "$env:RUNNER_TEMP/app/Notchyyyy.exe" -ArgumentList '--dark','--name','Alex','--perf',$dir -PassThru -Wait
          Write-Host "=== 150 %: defaults"
          Get-Content "$dir/summary.txt"

      # A test build for trying on a real laptop: self-contained (nothing to install), plus the smoothness check.
      - name: Test build (self-contained)
        if: always() && steps.build.outcome == 'success'
        run: |
          dotnet publish src/Notchyyyy/Notchyyyy.csproj -c Release -r win-x64 --self-contained true -p:PublishReadyToRun=true -o "$env:RUNNER_TEMP/testbuild/Notchyyyy"
          Copy-Item ci/measure-smoothness.cmd "$env:RUNNER_TEMP/testbuild/Notchyyyy/"

      - name: Upload test build
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: Notchyyyy-windows-test-build
          path: ${{ runner.temp }}/testbuild

      - name: Upload smoothness logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: perf
          path: ${{ runner.temp }}/perf

      - name: Upload self-test screenshots and logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: selftest
          path: ${{ runner.temp }}/selftest

      - name: Upload test results and frames
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tests
          path: |
            ${{ runner.temp }}/test-results
            ${{ runner.temp }}/frames/open-close-dark-60
            ${{ runner.temp }}/frames/open-close-light-60
