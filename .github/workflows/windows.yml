# Notchyyyy for Windows: build, run the tests, then check the overlay on a real Windows desktop.
name: Windows

on:
  push:
    branches: [windows-port]
    paths: ['windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: windows
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: .NET SDK in use (pinned by windows/global.json)
        run: dotnet --version

      - name: Build
        id: build
        run: dotnet build Notchyyyy.sln -c Release

      - name: Tests (springs, hover rules, pixel-level frames)
        id: tests
        env:
          NOTCHYYYY_FRAMES: ${{ runner.temp }}/frames
        run: dotnet test Notchyyyy.sln -c Release --no-build --logger "trx;LogFileName=tests.trx" --results-directory "$env:RUNNER_TEMP/test-results"

      - name: Overlay self-test (dark)
        if: always() && steps.build.outcome == 'success'
        run: |
          $p = Start-Process -FilePath src/Notchyyyy/bin/Release/net8.0/Notchyyyy.exe -ArgumentList '--win-selftest','--dark','--out',"$env:RUNNER_TEMP/selftest" -PassThru -Wait
          Get-Content "$env:RUNNER_TEMP/selftest/selftest-dark.txt"
          exit $p.ExitCode

      - name: Overlay self-test (light)
        if: always() && steps.build.outcome == 'success'
        run: |
          $p = Start-Process -FilePath src/Notchyyyy/bin/Release/net8.0/Notchyyyy.exe -ArgumentList '--win-selftest','--light','--out',"$env:RUNNER_TEMP/selftest" -PassThru -Wait
          Get-Content "$env:RUNNER_TEMP/selftest/selftest-light.txt"
          exit $p.ExitCode

      - name: Upload self-test screenshots and logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: selftest
          path: ${{ runner.temp }}/selftest

      - name: Upload test results and frames
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tests
          path: |
            ${{ runner.temp }}/test-results
            ${{ runner.temp }}/frames/open-close-dark-60
            ${{ runner.temp }}/frames/open-close-light-60
